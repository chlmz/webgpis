<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A · Home institucional</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E456A}a:hover{color:#142C44}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Source Sans 3', system-ui, sans-serif; color: #23292E; background: #FFFFFF">
  <header style="height: 76px; flex-shrink: 0; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-bottom: 1px solid #E4EAEF">
    <img src="/_blob/2a8779fd8bb34f78439dfdab3e276147" alt="GPIS" style="height: 40px; width: auto; display: block">
    <nav aria-label="Principal" style="display: flex; gap: 32px; font-size: 16px; font-weight: 600">
      <a href="#" style="text-decoration: none; color: #1E456A; border-bottom: 2px solid #C98B2E; padding-bottom: 4px">GPIS</a>
      <a href="#" style="text-decoration: none; color: #23292E">Pesquisa</a>
      <a href="#" style="text-decoration: none; color: #23292E">Projetos</a>
      <a href="#" style="text-decoration: none; color: #23292E">Impacto</a>
      <a href="#" style="text-decoration: none; color: #23292E">Equipe</a>
      <a href="#" style="text-decoration: none; color: #23292E">Rede</a>
      <a href="#" style="text-decoration: none; color: #23292E">Contato</a>
    </nav>
  </header>
  <section aria-label="Apresentação do grupo" style="flex-grow: 1; position: relative; overflow: hidden; background: {{heroBg}}; display: flex; align-items: center; padding: 0 64px">
    <img src="/_blob/996a764a751d7617925fc0b918a87894" alt="" aria-hidden="true" style="position: absolute; right: -40px; top: 50%; transform: translateY(-50%); width: 560px; height: auto; opacity: {{markOpacity}}">
    <div style="position: relative; max-width: 680px; display: flex; flex-direction: column; gap: 24px">
      <div style="width: 48px; height: 2px; background: #C98B2E"></div>
      <span style="font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: rgba(255,255,255,0.78)">GPIS · FURG · Rio Grande, Brasil</span>
      <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 60px; line-height: 1.08; color: #FFFFFF; letter-spacing: -0.01em">Pesquisa que começa nas pessoas.</h1>
      <p style="margin: 0; font-size: 20px; line-height: 1.55; color: rgba(255,255,255,0.86); max-width: 540px">Investigamos como experiências sociais, familiares e ambientais moldam a saúde ao longo da vida.</p>
      <div style="display: flex; gap: 16px; margin-top: 8px">
        <a href="#" style="display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 4px; background: #FFFFFF; color: #1E456A; font-weight: 600; font-size: 16px; text-decoration: none">Conheça nossos projetos</a>
        <a href="#" style="display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.5); color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Linhas de pesquisa</a>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heroBg":{"editor":"color","default":"#1E456A","options":["#1E456A","#142C44","#2C5F8A"]},"markOpacity":{"editor":"range","default":0.08,"min":0.03,"max":0.3,"step":0.01},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { heroBg: this.props.heroBg ?? '#1E456A', markOpacity: this.props.markOpacity ?? 0.08 };
  }
}
</script>
</body>
</html>
