<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Padrão da categoria</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;font-family:Arial,sans-serif;background:#fff;color:#14233F;overflow:hidden}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 80px;border-bottom:1px solid #e5e9ef}
.hero{height:520px;background:linear-gradient(90deg,#0E2347 0 55%,#9BB3C8 55%);display:flex;align-items:center;padding:0 80px;color:#fff}
h1{font-size:64px;max-width:640px;line-height:1.05}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:48px 80px}
.c{height:200px;border:1px solid #e5e9ef;border-radius:12px;padding:24px;font-size:24px;font-weight:700}
</style></head><body>
<div class="nav"><b style="font-size:22px">GPIS</b><span>Pesquisa · Projetos · Equipe · Contato</span></div>
<div class="hero"><h1>Pesquisa que começa nas pessoas.</h1></div>
<div class="cards"><div class="c">Saúde mental</div><div class="c">Entre gerações</div><div class="c">Crises</div><div class="c">Métodos</div></div>
</body></html>
